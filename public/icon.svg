<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="androidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neuralCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(61, 220, 132, 0.25)" stroke-width="4" />

  <!-- Neural Tensor Grid Matrix Lines -->
  <g stroke="rgba(56, 189, 248, 0.15)" stroke-width="2">
    <line x1="96" y1="128" x2="416" y2="128" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="384" x2="416" y2="384" />
    <line x1="128" y1="96" x2="128" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="384" y1="96" x2="384" y2="416" />
  </g>

  <!-- Android Robot Head Dome (Modern Material You Style) -->
  <path d="M 166 220 A 90 90 0 0 1 346 220 Z" fill="url(#androidGreen)" filter="url(#glow)" />
  
  <!-- Robot Antennae -->
  <line x1="200" y1="150" x2="175" y2="115" stroke="#3ddc84" stroke-width="8" stroke-linecap="round" />
  <line x1="312" y1="150" x2="337" y2="115" stroke="#3ddc84" stroke-width="8" stroke-linecap="round" />

  <!-- Robot Eyes -->
  <circle cx="210" cy="188" r="10" fill="#0f172a" />
  <circle cx="302" cy="188" r="10" fill="#0f172a" />

  <!-- Central GGUF Quantized Tensor Core -->
  <rect x="180" y="240" width="152" height="152" rx="28" fill="#1e293b" stroke="url(#androidGreen)" stroke-width="5" />
  
  <!-- Neural Network Nodes inside Chip -->
  <circle cx="220" cy="280" r="10" fill="#38bdf8" />
  <circle cx="292" cy="280" r="10" fill="#38bdf8" />
  <circle cx="256" cy="316" r="12" fill="#3ddc84" filter="url(#glow)" />
  <circle cx="216" cy="352" r="9" fill="#818cf8" />
  <circle cx="296" cy="352" r="9" fill="#818cf8" />

  <!-- Connective Synapses -->
  <line x1="220" y1="280" x2="256" y2="316" stroke="rgba(56, 189, 248, 0.8)" stroke-width="3" />
  <line x1="292" y1="280" x2="256" y2="316" stroke="rgba(56, 189, 248, 0.8)" stroke-width="3" />
  <line x1="256" y1="316" x2="216" y2="352" stroke="rgba(61, 220, 132, 0.8)" stroke-width="3" />
  <line x1="256" y1="316" x2="296" y2="352" stroke="rgba(61, 220, 132, 0.8)" stroke-width="3" />

  <!-- GGUF Text Badge -->
  <rect x="206" y="408" width="100" height="26" rx="13" fill="#0369a1" />
  <text x="256" y="426" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">GGUF</text>
</svg>
